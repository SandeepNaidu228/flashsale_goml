services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: flashsale
      RABBITMQ_DEFAULT_PASS: flashsale_dev_password
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:17-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: flashsale
      POSTGRES_USER: flashsale
      POSTGRES_PASSWORD: flashsale_dev_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flashsale -d flashsale"]
      interval: 5s
      timeout: 3s
      retries: 10

  api1:
    build: ./server
    environment:
      PORT: "5000"
      INSTANCE_ID: api1
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_PASSWORD: flashsale_dev_password
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://flashsale:flashsale_dev_password@rabbitmq:5672
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  api2:
    build: ./server
    environment:
      PORT: "5000"
      INSTANCE_ID: api2
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_PASSWORD: flashsale_dev_password
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://flashsale:flashsale_dev_password@rabbitmq:5672
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api1
      - api2
    restart: unless-stopped
